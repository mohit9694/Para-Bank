name: Robot Framework Tests

on:
  push:
    branches:
      - main
      - "ms/**"

  pull_request:
    branches:
      - main

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: robot-automation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Robot Framework tests
        run: |
          mkdir -p results

          docker run --rm \
            -v "${{ github.workspace }}/TestCases:/automation/TestCases" \
            -v "${{ github.workspace }}/Resources:/automation/Resources" \
            -v "${{ github.workspace }}/Python:/automation/Python" \
            -v "${{ github.workspace }}/results:/automation/results" \
            robot-automation:latest \
            robot --outputdir /automation/results TestCases

      - name: Upload Robot Framework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-results
          path: results/